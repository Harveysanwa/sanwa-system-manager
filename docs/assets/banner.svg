<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="640" viewBox="0 0 1920 640" role="img" aria-label="Sanwa System Manager — Clear every obstacle for GTA 6. Local AI + Gaming + Office management for Windows.">
  <title>Sanwa System Manager — v1.5.0</title>
  <desc>Deep-space sci-fi HUD banner for the Sanwa System Manager: local-first Windows AI + gaming + office console. Original vector artwork, no screenshots, no personal data.</desc>

  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060f"/>
      <stop offset="0.45" stop-color="#060b1c"/>
      <stop offset="1" stop-color="#02040a"/>
    </linearGradient>
    <radialGradient id="nebulaCyan" cx="0.72" cy="0.30" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#0e7490" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaViolet" cx="0.30" cy="0.72" r="0.60">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#4c1d95" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="1.02" r="0.72">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.35" stop-color="#0891b2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#e0f2fe"/>
      <stop offset="0.72" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="ruleCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="planetFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#02040a" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="chipStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowTight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="24" y="24" width="1872" height="592" rx="26"/>
    </clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1920" height="640" fill="url(#bgBase)"/>
  <rect width="1920" height="640" fill="url(#nebulaCyan)"/>
  <rect width="1920" height="640" fill="url(#nebulaViolet)"/>
  <rect width="1920" height="640" fill="url(#horizonGlow)"/>

  <g clip-path="url(#frameClip)">
    <!-- star field -->
    <g fill="#dbeafe">
      <circle cx="96" cy="86" r="1.4" opacity="0.85"/>
      <circle cx="152" cy="214" r="1.0" opacity="0.55"/>
      <circle cx="212" cy="120" r="1.8" opacity="0.9"/>
      <circle cx="286" cy="58" r="1.1" opacity="0.6"/>
      <circle cx="338" cy="176" r="1.3" opacity="0.7"/>
      <circle cx="402" cy="96" r="1.0" opacity="0.5"/>
      <circle cx="478" cy="42" r="1.6" opacity="0.8"/>
      <circle cx="542" cy="148" r="1.1" opacity="0.55"/>
      <circle cx="618" cy="72" r="1.3" opacity="0.65"/>
      <circle cx="704" cy="132" r="1.0" opacity="0.5"/>
      <circle cx="782" cy="46" r="1.7" opacity="0.85"/>
      <circle cx="858" cy="168" r="1.2" opacity="0.6"/>
      <circle cx="932" cy="88" r="1.4" opacity="0.7"/>
      <circle cx="1024" cy="38" r="1.1" opacity="0.55"/>
      <circle cx="1112" cy="126" r="1.6" opacity="0.8"/>
      <circle cx="1206" cy="66" r="1.2" opacity="0.6"/>
      <circle cx="1288" cy="152" r="1.0" opacity="0.5"/>
      <circle cx="1372" cy="44" r="1.5" opacity="0.75"/>
      <circle cx="1456" cy="118" r="1.1" opacity="0.55"/>
      <circle cx="1548" cy="58" r="1.8" opacity="0.9"/>
      <circle cx="1634" cy="146" r="1.2" opacity="0.6"/>
      <circle cx="1712" cy="78" r="1.4" opacity="0.7"/>
      <circle cx="1802" cy="120" r="1.0" opacity="0.5"/>
      <circle cx="1862" cy="52" r="1.6" opacity="0.8"/>
      <circle cx="90" cy="470" r="1.2" opacity="0.55"/>
      <circle cx="188" cy="532" r="1.0" opacity="0.45"/>
      <circle cx="268" cy="452" r="1.4" opacity="0.6"/>
      <circle cx="356" cy="560" r="1.1" opacity="0.5"/>
      <circle cx="452" cy="498" r="1.5" opacity="0.7"/>
      <circle cx="560" cy="584" r="1.0" opacity="0.45"/>
      <circle cx="668" cy="520" r="1.3" opacity="0.6"/>
      <circle cx="772" cy="572" r="1.1" opacity="0.5"/>
      <circle cx="880" cy="486" r="1.4" opacity="0.6"/>
      <circle cx="992" cy="556" r="1.0" opacity="0.45"/>
      <circle cx="1102" cy="500" r="1.2" opacity="0.55"/>
      <circle cx="1216" cy="588" r="1.1" opacity="0.5"/>
      <circle cx="1328" cy="512" r="1.5" opacity="0.65"/>
      <circle cx="1436" cy="566" r="1.0" opacity="0.45"/>
      <circle cx="1548" cy="492" r="1.3" opacity="0.55"/>
      <circle cx="1666" cy="546" r="1.1" opacity="0.5"/>
      <circle cx="1782" cy="470" r="1.4" opacity="0.6"/>
      <circle cx="1872" cy="540" r="1.0" opacity="0.45"/>
    </g>
    <!-- bright stars with cross flare -->
    <g stroke="#a5f3fc" stroke-width="1" opacity="0.9" filter="url(#glowTight)">
      <path d="M212 110 v20 M202 120 h20"/>
      <path d="M782 36 v20 M772 46 h20"/>
      <path d="M1548 48 v20 M1538 58 h20"/>
      <path d="M452 488 v20 M442 498 h20"/>
    </g>

    <!-- perspective grid -->
    <g stroke="#22d3ee" stroke-width="1" opacity="0.10">
      <path d="M0 470 H1920"/>
      <path d="M0 500 H1920"/>
      <path d="M0 534 H1920"/>
      <path d="M0 572 H1920"/>
      <path d="M0 614 H1920"/>
      <path d="M240 640 L660 400"/>
      <path d="M480 640 L780 400"/>
      <path d="M720 640 L900 400"/>
      <path d="M960 640 L960 400"/>
      <path d="M1200 640 L1020 400"/>
      <path d="M1440 640 L1140 400"/>
      <path d="M1680 640 L1260 400"/>
    </g>
    <path d="M0 400 H1920" stroke="#22d3ee" stroke-width="1.2" opacity="0.28"/>

    <!-- orbit rings + planet on the right -->
    <g transform="translate(1560 300)">
      <circle r="218" fill="none" stroke="#22d3ee" stroke-width="1.1" opacity="0.16"/>
      <circle r="164" fill="none" stroke="#8b5cf6" stroke-width="1.1" opacity="0.22" stroke-dasharray="3 9"/>
      <circle r="116" fill="url(#planetFill)" stroke="#22d3ee" stroke-width="1.6" opacity="0.9"/>
      <ellipse rx="176" ry="42" fill="none" stroke="#67e8f9" stroke-width="1.6" opacity="0.55" transform="rotate(-18)"/>
      <ellipse rx="176" ry="42" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.35" transform="rotate(-18) translate(0 6)"/>
      <!-- planet terminator -->
      <path d="M-116 0 A116 116 0 0 1 116 0 A116 116 0 0 0 -116 0 Z" fill="#02040a" opacity="0.45"/>
      <circle r="3" fill="#e0f2fe" opacity="0.9" filter="url(#glowTight)"/>
      <!-- HUD ticks -->
      <g stroke="#67e8f9" stroke-width="2" opacity="0.7">
        <path d="M-236 0 h-16"/>
        <path d="M236 0 h16"/>
        <path d="M0 -236 v-16"/>
        <path d="M0 236 v16"/>
      </g>
      <!-- gauge arc -->
      <path d="M -196 96 A 218 218 0 0 1 -96 196" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
      <path d="M 96 -196 A 218 218 0 0 1 196 -96" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
      <!-- mini bars -->
      <g fill="#22d3ee" opacity="0.75">
        <rect x="-150" y="248" width="26" height="4" rx="2"/>
        <rect x="-118" y="248" width="16" height="4" rx="2" opacity="0.7"/>
        <rect x="-96" y="248" width="40" height="4" rx="2" opacity="0.5"/>
        <rect x="-50" y="248" width="10" height="4" rx="2" opacity="0.85"/>
      </g>
    </g>

    <!-- left accents -->
    <g>
      <rect x="88" y="92" width="44" height="3" fill="#22d3ee" opacity="0.9"/>
      <rect x="140" y="92" width="8" height="3" fill="#8b5cf6" opacity="0.9"/>
      <text x="88" y="126" fill="#67e8f9" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="6" opacity="0.9">LOCAL-FIRST · WINDOWS CONTROL HUD</text>
      <text x="88" y="152" fill="#7dd3fc" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="4" opacity="0.55">127.0.0.1 : 9900 · ZERO NPM DEPENDENCIES · NO CDN</text>
    </g>

    <!-- wordmark -->
    <g filter="url(#glowSoft)">
      <text x="84" y="290" fill="url(#wordmark)" font-family="'Segoe UI', 'Microsoft YaHei', Meiryo, sans-serif" font-size="128" font-weight="800" letter-spacing="14">SANWA</text>
    </g>
    <text x="90" y="338" fill="#cbd5e1" font-family="'Segoe UI', 'Microsoft YaHei', Meiryo, sans-serif" font-size="30" font-weight="600" letter-spacing="13" opacity="0.95">SYSTEM MANAGER</text>
    <rect x="88" y="360" width="586" height="2" fill="url(#ruleCyan)"/>

    <!-- slogan -->
    <text x="88" y="414" fill="#f8fafc" font-family="'Segoe UI', 'Microsoft YaHei', Meiryo, sans-serif" font-size="38" font-weight="700" letter-spacing="0.5">Clear every obstacle for GTA 6</text>
    <text x="88" y="456" fill="#67e8f9" font-family="'Segoe UI', 'Microsoft YaHei', Meiryo, sans-serif" font-size="24" font-weight="500" letter-spacing="0.4">Local AI + Gaming + Office management for Windows</text>
    <text x="88" y="492" fill="#a5b4fc" font-family="'Microsoft YaHei', 'Yu Gothic UI', 'Segoe UI', sans-serif" font-size="17" opacity="0.9">为GTA6到来扫清一切障碍 · Windows AI+游戏+办公 本地管理</text>
    <text x="88" y="520" fill="#a5b4fc" font-family="'Yu Gothic UI', 'Meiryo', 'Segoe UI', sans-serif" font-size="17" opacity="0.9">GTA6の到来に備えて、すべての障壁を取り払う — WindowsでAI・ゲーム・仕事をローカル管理</text>

    <!-- chips -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1.5">
      <g>
        <rect x="88" y="552" width="152" height="38" rx="19" fill="#0b1220" stroke="url(#chipStroke)" stroke-width="1.2"/>
        <text x="164" y="577" fill="#a5f3fc" text-anchor="middle">NODE.JS 22+</text>
      </g>
      <g>
        <rect x="252" y="552" width="176" height="38" rx="19" fill="#0b1220" stroke="url(#chipStroke)" stroke-width="1.2"/>
        <text x="340" y="577" fill="#a5f3fc" text-anchor="middle">WINDOWS 10 / 11</text>
      </g>
      <g>
        <rect x="440" y="552" width="122" height="38" rx="19" fill="#0b1220" stroke="url(#chipStroke)" stroke-width="1.2"/>
        <text x="501" y="577" fill="#c4b5fd" text-anchor="middle">MIT</text>
      </g>
      <g>
        <rect x="574" y="552" width="186" height="38" rx="19" fill="#0b1220" stroke="url(#chipStroke)" stroke-width="1.2"/>
        <text x="667" y="577" fill="#a5f3fc" text-anchor="middle">NO TELEMETRY</text>
      </g>
      <g>
        <rect x="772" y="552" width="168" height="38" rx="19" fill="#0b1220" stroke="url(#chipStroke)" stroke-width="1.2"/>
        <text x="856" y="577" fill="#c4b5fd" text-anchor="middle">LOCAL-FIRST</text>
      </g>
    </g>

    <!-- footer meta -->
    <text x="1832" y="577" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="15" text-anchor="end" letter-spacing="2" opacity="0.85">© 驼学长 · MIT LICENSE · v1.5.0</text>

    <!-- frame + corner brackets -->
    <rect x="24" y="24" width="1872" height="592" rx="26" fill="none" stroke="#22d3ee" stroke-width="1.4" opacity="0.28"/>
    <g stroke="#67e8f9" stroke-width="2.4" fill="none" opacity="0.85">
      <path d="M56 92 V56 H92"/>
      <path d="M1864 92 V56 H1828"/>
      <path d="M56 548 V584 H92"/>
      <path d="M1864 548 V584 H1828"/>
    </g>
    <g fill="#22d3ee" opacity="0.8">
      <circle cx="960" cy="26" r="2.6"/>
      <circle cx="960" cy="614" r="2.6"/>
    </g>
  </g>
</svg>
